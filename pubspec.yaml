name: pipo_firebase_app_distribution
description: "A Dart CLI tool to automatically upload APK/IPA to Firebase App Distribution with auto-detection of Firebase configuration from google-services.json and GoogleService-Info.plist"
version: 0.0.1
homepage: https://github.com/yourusername/pipo_firebase_app_distribution
repository: https://github.com/yourusername/pipo_firebase_app_distribution
issue_tracker: https://github.com/yourusername/pipo_firebase_app_distribution/issues

environment:
  sdk: ^3.9.2

dependencies:
  args: ^2.5.0
  yaml: ^3.1.2
  path: ^1.9.0
  xml: ^6.5.0
  cli_util: ^0.4.1
  process_run: ^1.2.0
  mason_logger: ^0.2.16

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.8

executables:
  pipo_firebase: pipo_firebase_app_distribution
